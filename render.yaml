version: "1"

services:
  # 1. API GATEWAY (Public ra Internet)
  - type: web
    name: gateway-service
    env: docker
    dockerContext: .
    dockerfilePath: gateway/Dockerfile
    envVars:
      # Thay vì host.docker.internal, Render dùng tên của Private Service
      - key: AUTH_SERVICE_URL
        value: http://auth-service:3001
      - key: FILE_SERVICE_URL
        value: http://file-service:3002
      - key: WORKSPACE_SERVICE_URL
        value: http://workspace-service:3003
      - key: SEARCH_SERVICE_URL
        value: http://search-worker:3004
      - key: STORAGE_SERVICE_URL
        value: http://storage-service:3005
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app

  # 2. AUTH SERVICE (Private)
  - type: pserv
    name: auth-service
    env: docker
    dockerContext: .
    dockerfilePath: services/auth-service/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: WORKSPACE_SERVICE_URL
        value: http://workspace-service:3003
      - key: FILE_SERVICE_URL
        value: http://file-service:3002

  # 3. FILE SERVICE (Private)
  - type: pserv
    name: file-service
    env: docker
    dockerContext: .
    dockerfilePath: services/file-service/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MINIO_ENDPOINT
        value: https://gmxjhyoufzloeuubumsr.supabase.co
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_BUCKET
        value: file-storage
      - key: REDIS_URL
        value: redis-cli --tls -u redis://default:gQAAAAAAATBhAAIgcDI2YzlhYTM1MGIxM2Y0YzkwYThjMDRlNzc3ZWFmZGJkMQ@dominant-cheetah-77921.upstash.io:6379
      - key: WORKSPACE_SERVICE_URL
        value: http://workspace-service:3003
      - key: STORAGE_SERVICE_URL
        value: http://storage-service:3005
      - key: FRONTEND_URL
        value: https://fe-workspace-system.vercel.app

  # 4. WORKSPACE SERVICE (Private)
  - type: pserv
    name: workspace-service
    env: docker
    dockerContext: .
    dockerfilePath: services/workspace-service/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AUTH_SERVICE_URL
        value: http://auth-service:3001

  # 5. STORAGE SERVICE (Private)
  - type: pserv
    name: storage-service
    env: docker
    dockerContext: .
    dockerfilePath: services/storage-service/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: MINIO_ENDPOINT
        value: https://gmxjhyoufzloeuubumsr.supabase.co
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_BUCKET
        value: file-storage
      - key: MINIO_USE_SSL
        value: false
  # 6. SEARCH WORKER (Private / Worker)
  - type: pserv
    name: search-worker
    env: docker
    dockerContext: .
    dockerfilePath: services/search-worker/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CHROMA_URL
        sync: false 
      - key: TIKA-URL
        sync: false 
      - key: REDIS_URL
        sync: false
      - key: WORKSPACE_SERVICE_URL
        value: http://workspace-service:3003
      - key: STORAGE_SERVICE_URL
        value: http://storage-service:3005
      - key: FILE_SERVICE_URL
        value: http://file-service:3002
      - key: FRONTEND_URL
        value: https://fe-workspace-system.vercel.app
  
  - type: pserv
    name: tika-service
    env: docker
    dockerContext: .
    dockerfilePath: services/search-worker/Dockerfile

  - type: pserv
    name: chroma-service
    env: docker
    dockerContext: .
    dockerfilePath: services/search-worker/Dockerfile
    disk:
      name: chroma-data
      mountPath: /chroma/chroma
      sizeGB: 1 
