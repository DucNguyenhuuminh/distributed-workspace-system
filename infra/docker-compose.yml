services:

  mongodb:
    image: mongo:7
    container_name: workspace-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: adminducbon
      MONGO_INITDB_ROOT_PASSWORD: Adminducbon123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          memory: 256m

  redis:
    image: redis:7-alpine
    container_name: workspace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data 
    command: >
      redis-server
      --maxmemory 192mb
      --maxmemory-policy noeviction 
      --appendonly yes 
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  minio:
    image: minio/minio:latest
    container_name: workspace-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: adminducbon
      MINIO_ROOT_PASSWORD: Adminducbon1@3
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 256m

  chroma:
    image: chromadb/chroma:latest
    container_name: workspace-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_SERVER_AUTHN_CREDENTIALS=
    volumes:
      - chroma_data:/chroma/chroma
    deploy:
      resources:
        limits:
          memory: 300m
  
  tika:
    image: apache/tika:latest
    container_name: workspace-tika
    restart: unless-stopped
    ports:
      - "9998:9998"
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  mongo_data:
  minio_data:
  redis_data:
  chroma_data: