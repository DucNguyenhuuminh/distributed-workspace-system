services:

  mongodb:
    image: mongo:7
    container_name: workspace-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: adminducbon
      MONGO_INITDB_ROOT_PASSWORD: Adminducbon123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          memory: 256m

  redis:
    image: redis:7-alpine
    container_name: workspace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data 
    command: >
      redis-server
      --maxmemory 192mb
      --maxmemory-policy noeviction 
      --appendonly yes 
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  minio:
    image: minio/minio:latest
    container_name: workspace-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: adminducbon
      MINIO_ROOT_PASSWORD: Adminducbon1@3
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 256m

  # chroma:
  #   image: chromadb/chroma:latest
  #   container_name: workspace-chroma
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - IS_PERSISTENT=TRUE
  #     - ANONYMIZED_TELEMETRY=FALSE
  #     - CHROMA_SERVER_AUTHN_CREDENTIALS=
  #   volumes:
  #     - chroma_data:/chroma/chroma
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 300m
  
  tika:
    image: apache/tika:latest
    container_name: workspace-tika
    restart: unless-stopped
    ports:
      - "9998:9998"
    deploy:
      resources:
        limits:
          memory: 512m

  # ==========================================
  # 2. NHÓM MICROSERVICES (NODE.JS)
  # ==========================================
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: api_gateway
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      - redis
    networks:
      - workspace-network

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth_service
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
    networks:
      - workspace-network

  file-service:
    build:
      context: .
      dockerfile: services/file-service/Dockerfile
    container_name: file_service
    ports:
      - "3002:3002"
    depends_on:
      - mongodb
      - minio
    networks:
      - workspace-network

  search-worker:
    build:
      context: .
      dockerfile: services/search-worker/Dockerfile
    container_name: search_worker
    ports:
      - "3004:3004"
    depends_on:
      - mongodb
      - redis
    networks:
      - workspace-network

  storage-service:
    build:
      context: .
      dockerfile: services/storage-service/Dockerfile
    container_name: storage_service
    ports:
      - "3005:3005"
    depends_on:
      - minio
    networks:
      - workspace-network

  noti-service:
    build:
      context: .
      dockerfile: services/noti-service/Dockerfile
    container_name: noti_service
    ports:
      - "3006:3006"
    depends_on:
      - mongodb
      - redis
    networks:
      - workspace-network
volumes:
  mongo_data:
  minio_data:
  redis_data:

networks:
  workspace-network:
    driver: bridge